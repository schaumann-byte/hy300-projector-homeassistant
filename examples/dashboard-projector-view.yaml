                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_zoom_2
                - type: custom:mushroom-template-card
                  entity: button.projetor_keystone
                  primary: "Keystone"
                  icon: mdi:trapezoid
                  icon_color: "{{ 'blue' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_keystone
                - type: custom:mushroom-template-card
                  entity: button.projetor_zoom
                  primary: "Zoom +"
                  icon: mdi:magnify-plus
                  icon_color: "{{ 'blue' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_zoom
                - type: custom:mushroom-template-card
                  entity: button.projetor_entrada
                  primary: "Entrada"
                  icon: mdi:video-input-hdmi
                  icon_color: "{{ 'teal' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
