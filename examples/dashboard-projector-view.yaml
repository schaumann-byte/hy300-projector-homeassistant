# Example Lovelace view (sections) for the projector — Mushroom + card-mod required.
# Paste under `views:` of a YAML dashboard. Entity ids assume the entry is named "Projetor".
views:
  # ═════════════════════════════════════════════════════════════════════
  # ABA PROJETOR — integração própria hy300_projetor (~/hy300-projetor):
  # API local Lumina Go (<projector-ip>:8899) + ligar por IR (ZC-XZ).
  # Controles só aparecem com o projetor ligado (API só responde ligado).
  # ═════════════════════════════════════════════════════════════════════
  - title: Projetor
    path: projetor
    icon: mdi:projector
    type: sections
    max_columns: 4
    sections:

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Projetor
            icon: mdi:projector
          - type: custom:mushroom-media-player-card
            entity: media_player.projetor
            name: HY300 Pro+
            icon: mdi:projector
            use_media_info: false
            show_volume_level: false
            volume_controls:
              - volume_mute
              - volume_buttons
            media_controls:
              - on_off
              - play_pause
              - previous
              - next
            collapsible_controls: false
            fill_container: true
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, {{ '#7E57C2' if is_state('media_player.projetor', 'on') else '#3a3440' }}66 0%, var(--card-background-color) 70%) !important;
                }
          - type: custom:mushroom-template-card
            primary: Projetor desligado
            secondary: Toque para ligar (via infravermelho)
            icon: mdi:power
            icon_color: grey
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: media_player.projetor
                state_not: 'on'
            tap_action:
              action: perform-action
              perform_action: media_player.turn_on
              target:
                entity_id: media_player.projetor
          - type: heading
            heading: Apps e entradas
            heading_style: subtitle
          # ícone colorido só quando o toque funciona (apps via ADB precisam de binary_sensor.projetor_adb)
          - type: grid
            grid_options:
              columns: full
            columns: 4
            square: false
            # apps abertos via ADB (integração hy300_projetor); o app na tela fica com borda
            cards:
              - type: custom:mushroom-template-card
                primary: "SmartTube"
                icon: mdi:youtube-tv
                icon_color: "{{ 'red' if is_state('media_player.projetor', 'on') and is_state('binary_sensor.projetor_adb', 'on') else 'grey' }}"
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: media_player.select_source
                  target:
                    entity_id: media_player.projetor
                  data:
                    source: "SmartTube"
                card_mod:
                  style: |
                    ha-card { {% if state_attr('media_player.projetor', 'source') == 'SmartTube' %}border: 2px solid #D0BCFF !important;{% endif %} }
              - type: custom:mushroom-template-card
                primary: "Stremio"
                icon: mdi:movie-open-play
                icon_color: "{{ 'deep-purple' if is_state('media_player.projetor', 'on') and is_state('binary_sensor.projetor_adb', 'on') else 'grey' }}"
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: media_player.select_source
                  target:
                    entity_id: media_player.projetor
                  data:
                    source: "Stremio"
                card_mod:
                  style: |
                    ha-card { {% if state_attr('media_player.projetor', 'source') == 'Stremio' %}border: 2px solid #D0BCFF !important;{% endif %} }
              - type: custom:mushroom-template-card
                primary: "Crunchyroll"
                icon: mdi:alpha-c-circle
                icon_color: "{{ 'orange' if is_state('media_player.projetor', 'on') and is_state('binary_sensor.projetor_adb', 'on') else 'grey' }}"
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: media_player.select_source
                  target:
                    entity_id: media_player.projetor
                  data:
                    source: "Crunchyroll"
                card_mod:
                  style: |
                    ha-card { {% if state_attr('media_player.projetor', 'source') == 'Crunchyroll' %}border: 2px solid #D0BCFF !important;{% endif %} }
              - type: custom:mushroom-template-card
                primary: "Início"
                icon: mdi:home
                icon_color: "{{ 'deep-purple' if is_state('media_player.projetor', 'on') else 'grey' }}"
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: media_player.select_source
                  target:
                    entity_id: media_player.projetor
                  data:
                    source: "Início"
                card_mod:
                  style: |
                    ha-card { {% if state_attr('media_player.projetor', 'source') == 'Início' %}border: 2px solid #D0BCFF !important;{% endif %} }
              - type: custom:mushroom-template-card
                primary: "Todos os apps"
                icon: mdi:apps
                icon_color: "{{ 'deep-purple' if is_state('media_player.projetor', 'on') else 'grey' }}"
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: media_player.select_source
                  target:
                    entity_id: media_player.projetor
                  data:
                    source: "Todos os apps"
                card_mod:
                  style: |
                    ha-card { {% if state_attr('media_player.projetor', 'source') == 'Todos os apps' %}border: 2px solid #D0BCFF !important;{% endif %} }
              - type: custom:mushroom-template-card
                primary: "Entrada (HDMI)"
                icon: mdi:video-input-hdmi
                icon_color: "{{ 'teal' if is_state('media_player.projetor', 'on') else 'grey' }}"
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: media_player.select_source
                  target:
                    entity_id: media_player.projetor
                  data:
                    source: "Entrada (HDMI)"
                card_mod:
                  style: |
                    ha-card { {% if state_attr('media_player.projetor', 'source') == 'Entrada (HDMI)' %}border: 2px solid #D0BCFF !important;{% endif %} }
              - type: custom:mushroom-template-card
                primary: "Espelhar tela"
                icon: mdi:cast
                icon_color: "{{ 'teal' if is_state('media_player.projetor', 'on') else 'grey' }}"
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: media_player.select_source
                  target:
                    entity_id: media_player.projetor
                  data:
                    source: "Espelhar tela"
                card_mod:
                  style: |
                    ha-card { {% if state_attr('media_player.projetor', 'source') == 'Espelhar tela' %}border: 2px solid #D0BCFF !important;{% endif %} }
              - type: custom:mushroom-template-card
                primary: "USB"
                icon: mdi:usb
                icon_color: "{{ 'teal' if is_state('media_player.projetor', 'on') else 'grey' }}"
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: media_player.select_source
                  target:
                    entity_id: media_player.projetor
                  data:
                    source: "USB"
                card_mod:
                  style: |
                    ha-card { {% if state_attr('media_player.projetor', 'source') == 'USB' %}border: 2px solid #D0BCFF !important;{% endif %} }
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Controle
            icon: mdi:remote-tv
          - type: grid
            grid_options:
              columns: full
            columns: 3
            square: false
            cards:
                - type: custom:mushroom-template-card
                  entity: button.projetor_voltar
                  icon: mdi:arrow-left
                  icon_color: "{{ 'grey' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_voltar
                - type: custom:mushroom-template-card
                  entity: button.projetor_cima
                  icon: mdi:chevron-up
                  icon_color: "{{ 'deep-purple' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_cima
                - type: custom:mushroom-template-card
                  entity: button.projetor_menu
                  icon: mdi:menu
                  icon_color: "{{ 'grey' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_menu
                - type: custom:mushroom-template-card
                  entity: button.projetor_esquerda
                  icon: mdi:chevron-left
                  icon_color: "{{ 'deep-purple' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_esquerda
                - type: custom:mushroom-template-card
                  entity: button.projetor_ok
                  primary: "OK"
                  icon: mdi:checkbox-blank-circle
                  icon_color: "{{ 'deep-purple' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_ok
                - type: custom:mushroom-template-card
                  entity: button.projetor_direita
                  icon: mdi:chevron-right
                  icon_color: "{{ 'deep-purple' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_direita
                - type: custom:mushroom-template-card
                  entity: button.projetor_inicio
                  icon: mdi:home
                  icon_color: "{{ 'grey' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_inicio
                - type: custom:mushroom-template-card
                  entity: button.projetor_baixo
                  icon: mdi:chevron-down
                  icon_color: "{{ 'deep-purple' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_baixo
                - type: custom:mushroom-template-card
                  entity: button.projetor_configuracoes
                  icon: mdi:cog
                  icon_color: "{{ 'grey' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_configuracoes
          - type: heading
            heading: Imagem
            heading_style: subtitle
          - type: grid
            grid_options:
              columns: full
            columns: 3
            square: false
            cards:
                - type: custom:mushroom-template-card
                  entity: button.projetor_foco_2
                  primary: "Foco −"
                  icon: mdi:minus
                  icon_color: "{{ 'amber' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.projetor_foco_2
                - type: custom:mushroom-template-card
                  entity: button.projetor_foco_automatico
                  primary: "Auto foco"
                  icon: mdi:image-filter-center-focus
                  icon_color: "{{ 'amber' if is_state('media_player.projetor', 'on') else 'grey' }}"
                  layout: vertical
                  tap_action:
                    action: perform-action
